# Backend mesajları (Türkçe). CAP, isteğin Accept-Language başlığına göre seçer.
EMAIL_INVALID=Lütfen geçerli bir e-posta adresi girin.
PASSWORD_WEAK=Parola en az 8 karakter olmalı ve bir büyük harf, bir küçük harf, bir rakam ve bir özel karakter içermelidir.
EMAIL_ALREADY_EXISTS=Bu e-posta adresiyle kayıtlı bir hesap zaten var.
INVALID_CREDENTIALS=E-posta veya parola hatalı.
SESSION_REQUIRED=Lütfen önce giriş yapın.
SESSION_EXPIRED=Oturumunuzun süresi doldu. Lütfen tekrar giriş yapın.
APPLICATION_NOT_FOUND=Başvuru bulunamadı.
APPLICATION_LOCKED=Bu başvuru gönderildi ve artık değiştirilemez.
COMPANY_NAME_REQUIRED=Firma adı zorunludur.
CONTACT_PERSON_REQUIRED=İlgili kişi zorunludur.
CERTIFICATE_REQUIRED=Bir sertifika (PDF) yüklenmelidir.
CERTIFICATE_NEW_REQUIRED=Tekrar başvurmadan önce lütfen yeni bir sertifika yükleyin.
CERTIFICATE_TOO_LARGE=Sertifika 10 MB'tan büyük olamaz.
CERTIFICATE_NOT_PDF=Yalnızca PDF dosyası yüklenebilir.
CERTIFICATE_NOT_REVISABLE=Bu tekrar başvuruda sertifika değiştirilemez.
FIELD_NOT_REVISABLE="{0}" alanı bu tekrar başvuruda değiştirilemez.
FIELD_TOO_LONG="{0}" alanı en fazla {1} karakter olabilir.
CATEGORY_INVALID=Lütfen geçerli bir kategori seçin.
WEBSITE_INVALID=Lütfen geçerli bir web adresi girin (örn. https://ornek.com).
ALREADY_DECIDED=Bu başvuru için zaten karar verilmiş.
REJECTION_COMMENT_REQUIRED=Bir başvuruyu reddetmek için yorum girmek zorunludur.
REVISION_FIELDS_INVALID=Revizyon için bilinmeyen bir alan seçildi.
AI_NO_TEXT=Sertifikadan okunabilir metin çıkarılamadı (örn. taranmış görüntü). Lütfen elle karar verin.
AI_UNAVAILABLE=AI analizi şu anda yapılamıyor. Lütfen elle karar verin.
