PASSWORD_WEAK=The password must be at least 8 characters long and contain an uppercase letter, a lowercase letter, a digit and a special character.
EMAIL_ALREADY_EXISTS=An account with this e-mail address already exists.
INVALID_CREDENTIALS=E-mail or password is incorrect.
SESSION_REQUIRED=Please log in first.
